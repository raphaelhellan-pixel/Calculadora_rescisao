<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Rescisão de Contrato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #cc367c;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #69c220;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
            color: #444;
        }
        .result-item.total {
            font-weight: bold;
            font-size: 18px;
            color: #007bff;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Rescisão</h2>
    
    <div class="form-group">
        <label for="salario">Salário Bruto (R$):</label>
        <input type="number" id="salario" placeholder="Ex: 3000.00" step="0.01">
    </div>

    <div class="form-group">
        <label for="diasTrabalhados">Dias trabalhados no mês da rescisão:</label>
        <input type="number" id="diasTrabalhados" placeholder="Ex: 15" min="0" max="31">
    </div>

    <div class="form-group">
        <label for="meses13">Meses trabalhados no ano (para 13º):</label>
        <input type="number" id="meses13" placeholder="Ex: 6" min="0" max="12">
    </div>

    <div class="form-group">
        <label for="mesesFerias">Meses trabalhados no período de férias:</label>
        <input type="number" id="mesesFerias" placeholder="Ex: 10" min="0" max="12">
    </div>

    <button onclick="calcularRescisao()">Calcular Rescisão</button>

    <div class="results" id="resultados" style="display: none;">
        <h3>Resultado Estimado:</h3>
        <div class="result-item">
            <span>Saldo de Salário:</span>
            <span id="resSaldo">R$ 0,00</span>
        </div>
        <div class="result-item">
            <span>13º Salário Proporcional:</span>
            <span id="res13">R$ 0,00</span>
        </div>
        <div class="result-item">
            <span>Férias Proporcionais + 1/3:</span>
            <span id="resFerias">R$ 0,00</span>
        </div>
        <div class="result-item total">
            <span>Total Bruto Estimado:</span>
            <span id="resTotal">R$ 0,00</span>
        </div>
    </div>
</div>

<script>
    function calcularRescisao() {
        // Obter valores dos inputs
        const salario = parseFloat(document.getElementById('salario').value) || 0;
        const diasTrabalhados = parseInt(document.getElementById('diasTrabalhados').value) || 0;
        const meses13 = parseInt(document.getElementById('meses13').value) || 0;
        const mesesFerias = parseInt(document.getElementById('mesesFerias').value) || 0;

        // 1. Saldo de Salário (Salário / 30 * dias trabalhados)
        const saldoSalario = (salario / 30) * diasTrabalhados;

        // 2. 13º Salário Proporcional ((Salário / 12) * meses trabalhados)
        const decimoTerceiro = (salario / 12) * meses13;

        // 3. Férias Proporcionais + 1/3 (((Salário / 12) * meses) + 1/3)
        const feriasProporcionais = (salario / 12) * mesesFerias;
        const tercoConstitucional = feriasProporcionais / 3;
        const totalFerias = feriasProporcionais + tercoConstitucional;

        // 4. Total Geral Bruto
        const totalGeral = saldoSalario + decimoTerceiro + totalFerias;

        // Exibir resultados formatados em Real (BRL)
        document.getElementById('resSaldo').innerText = saldoSalario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('res13').innerText = decimoTerceiro.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('resFerias').innerText = totalFerias.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('resTotal').innerText = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // Mostrar o bloco de resultados
        document.getElementById('resultados').style.display = 'block';
    }
</script>

</body>
</html>
